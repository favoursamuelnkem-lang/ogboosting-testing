<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox - OG Boosting</title><link rel="stylesheet" href="./output.css"><style>body{background:#f6f8fa;color:#172033} .bubble{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body class="min-h-screen"><header class="bg-white border-b p-4 sm:p-6 flex flex-wrap items-center justify-between gap-3"><div><a href="admin.html" class="text-sm text-orange-600 font-bold">← Back to Admin</a><h1 class="text-2xl font-black text-[#0B4F63] mt-1">Support Inbox</h1><p class="text-sm text-gray-500">Reply to customer live-chat messages.</p></div><button id="refreshInbox" class="rounded-xl bg-[#0B4F63] text-white font-bold px-4 py-3">Refresh</button></header><main class="max-w-7xl mx-auto p-3 sm:p-6 grid lg:grid-cols-[320px_1fr] gap-4"><section class="bg-white border rounded-2xl overflow-hidden"><div class="p-4 border-b flex items-center justify-between"><b>Conversations</b><select id="statusFilter" class="border rounded-lg p-2 text-sm"><option value="open">Open</option><option value="closed">Closed</option><option value="all">All</option></select></div><div id="conversationList" class="divide-y max-h-[70vh] overflow-y-auto p-2"><p class="p-4 text-sm text-gray-500">Loading…</p></div></section><section class="bg-white border rounded-2xl overflow-hidden min-h-[65vh] flex flex-col"><div id="conversationHeading" class="p-4 border-b"><b>Select a conversation</b><p class="text-sm text-gray-500">Customer messages will appear here.</p></div><div id="conversationMessages" class="flex-1 p-4 sm:p-6 bg-gray-50 space-y-3 overflow-y-auto"><p class="text-sm text-gray-500">Choose a conversation from the list.</p></div><form id="replyForm" class="p-3 sm:p-4 border-t flex gap-2"><input id="replyInput" maxlength="2000" class="min-w-0 flex-1 border rounded-xl p-3" placeholder="Write a reply…" required disabled><button id="replyButton" class="rounded-xl bg-[#0B4F63] text-white font-bold px-4" disabled>Reply</button></form><div class="p-3 border-t flex gap-2"><button id="closeConversation" class="rounded-xl border px-4 py-2 text-sm font-bold" disabled>Close conversation</button><p id="inboxNotice" class="text-sm text-red-600 self-center"></p></div></section></main><script>
const API_URL='https://ogboosting-testing.onrender.com',token=localStorage.getItem('ogBoostingAdminToken');if(!token)location.href='./admin-login.html';const $=id=>document.getElementById(id);let conversations=[],active=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(path,opts={}){const r=await fetch(API_URL+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){localStorage.removeItem('ogBoostingAdminToken');location.href='./admin-login.html';throw Error('Admin session expired.')}if(!r.ok||!d.success)throw Error(d.message||'Request failed.');return d}function notice(t){$('inboxNotice').textContent=t||''}async function loadList(){try{const d=await api('/api/admin/support/conversations?status='+encodeURIComponent($('statusFilter').value));conversations=d.conversations||[];$('conversationList').innerHTML=conversations.length?conversations.map(c=>{const last=c.messages?.[c.messages.length-1];return `<button data-conversation="${c._id}" class="w-full text-left rounded-xl p-3 hover:bg-gray-50 ${active?._id===c._id?'bg-orange-50 border border-orange-100':''}"><div class="flex justify-between gap-2"><b class="text-sm text-[#0B4F63]">${esc(c.userId?.fullName||'Customer')}</b><span class="text-[10px] text-gray-400">${c.lastMessageAt?new Date(c.lastMessageAt).toLocaleDateString():''}</span></div><p class="text-xs text-gray-500 truncate mt-1">${esc(c.userId?.email||'')}</p><p class="text-sm text-gray-600 truncate mt-2">${esc(last?.text||'No messages yet')}</p></button>`}).join(''):'<p class="p-4 text-sm text-gray-500">No conversations found.</p>';document.querySelectorAll('[data-conversation]').forEach(b=>b.onclick=()=>selectConversation(b.dataset.conversation));if(active){const refreshed=conversations.find(c=>c._id===active._id);if(refreshed)await selectConversation(refreshed._id,false)}}catch(e){notice(e.message)}}async function selectConversation(id,fetchOne=true){try{const c=fetchOne?(await api('/api/admin/support/conversations/'+id)).conversation:conversations.find(x=>x._id===id);if(!c)return;active=c;$('conversationHeading').innerHTML=`<div class="flex flex-wrap items-center justify-between gap-2"><div><b>${esc(c.userId?.fullName||'Customer')}</b><p class="text-sm text-gray-500">${esc(c.userId?.email||'')}</p></div><span class="text-xs font-bold ${c.status==='open'?'text-green-700':'text-gray-500'}">${esc(c.status)}</span></div>`;$('conversationMessages').innerHTML=(c.messages||[]).map(m=>`<div class="flex ${m.sender==='admin'?'justify-end':'justify-start'}"><div class="max-w-[85%] rounded-2xl px-4 py-3 ${m.sender==='admin'?'bg-[#0B4F63] text-white':'bg-white border'}"><p class="text-sm bubble">${esc(m.text)}</p><p class="text-[10px] mt-2 opacity-70">${m.sender==='admin'?'You / Support':'Customer'} · ${m.sentAt?new Date(m.sentAt).toLocaleString():''}</p></div></div>`).join('')||'<p class="text-sm text-gray-500">No messages yet.</p>';$('conversationMessages').scrollTop=$('conversationMessages').scrollHeight;$('replyInput').disabled=c.status==='closed';$('replyButton').disabled=c.status==='closed';$('closeConversation').disabled=false;$('closeConversation').textContent=c.status==='closed'?'Reopen conversation':'Close conversation';notice('');await loadListNoRefresh()}catch(e){notice(e.message)}}async function loadListNoRefresh(){document.querySelectorAll('[data-conversation]').forEach(b=>{b.classList.toggle('bg-orange-50',b.dataset.conversation===active?._id);b.classList.toggle('border',b.dataset.conversation===active?._id)})}$('replyForm').addEventListener('submit',async e=>{e.preventDefault();if(!active)return;const text=$('replyInput').value.trim();if(!text)return;$('replyButton').disabled=true;try{await api('/api/admin/support/conversations/'+active._id+'/messages',{method:'POST',body:JSON.stringify({text})});$('replyInput').value='';await selectConversation(active._id);await loadList()}catch(err){notice(err.message)}finally{$('replyButton').disabled=active?.status==='closed'}});$('closeConversation').onclick=async()=>{if(!active)return;try{const status=active.status==='closed'?'open':'closed';await api('/api/admin/support/conversations/'+active._id,{method:'PATCH',body:JSON.stringify({status})});await loadList();if(active)await selectConversation(active._id)}catch(e){notice(e.message)}};$('refreshInbox').onclick=loadList;$('statusFilter').onchange=()=>{active=null;$('conversationHeading').innerHTML='<b>Select a conversation</b><p class="text-sm text-gray-500">Choose a conversation from the list.</p>';$('conversationMessages').innerHTML='';$('replyInput').disabled=true;$('replyButton').disabled=true;$('closeConversation').disabled=true;loadList()};loadList();setInterval(loadList,15000);
</script></body></html>
