<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Successful - OG Boost</title>

  <link
    rel="stylesheet"
    href="./output.css"
  >

  <link rel="stylesheet" href="./toast.css">

</head>

<body
  class="min-h-screen bg-[#f6f8fa] flex items-center justify-center px-5"
>

  <div
    class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-sm"
  >

    <div
      id="icon"
      class="w-16 h-16 rounded-full bg-gray-100 mx-auto flex items-center justify-center text-2xl"
    >
      ⏳
    </div>

    <h1
      id="title"
      class="text-2xl font-black mt-5"
    >
      Verifying Payment...
    </h1>

    <p
      id="message"
      class="text-gray-400 text-sm mt-2"
    >
      Please wait while we confirm your payment.
    </p>

  </div>


<script src="./toast.js"></script>

<script>

const API_URL =
  "https://ogboosting-testing.onrender.com";


async function verifyPayment() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const transactionId =
    params.get("transaction_id");

  const txRef =
    params.get("tx_ref");

const token =
  localStorage.getItem("ogBoostingToken") ||
  sessionStorage.getItem("ogBoostingToken");


  if (
    !transactionId ||
    !txRef ||
    !token
  ) {

    showError(
      "Payment information is missing."
    );

    return;

  }


  try {

    const response =
      await fetch(

        `${API_URL}/api/wallet/verify?transaction_id=${encodeURIComponent(transactionId)}&tx_ref=${encodeURIComponent(txRef)}`,

        {

          method: "GET",

          headers: {

            Authorization:
              `Bearer ${token}`

          }

        }

      );


    const data =
      await response.json();


    if (!response.ok || !data.success) {

      showError(
        data.message ||
        "Payment could not be verified."
      );

      return;

    }


    document.getElementById(
      "icon"
    ).innerHTML = "✓";


    document.getElementById(
      "icon"
    ).className =
      "w-16 h-16 rounded-full bg-green-50 text-green-600 mx-auto flex items-center justify-center text-3xl font-bold";


    document.getElementById(
      "title"
    ).textContent =
      "Payment Successful";


    document.getElementById(
      "message"
    ).textContent =
      `₦${Number(data.amount).toLocaleString()} has been added to your wallet.`;

    showToast(
      `₦${Number(data.amount).toLocaleString("en-NG")} has been added to your wallet.`,
      "success",
      { title: "Deposit successful", duration: 4500 }
    );

    setTimeout(() => {

      window.location.href =
        "wallet.html";

    }, 2500);


  } catch (error) {

    console.error(error);

    showError(
      "Unable to connect to the server."
    );

  }

}


function showError(message) {

  showToast(message, "error", { title: "Deposit verification failed", duration: 6000 });

  document.getElementById(
    "icon"
  ).innerHTML = "✕";


  document.getElementById(
    "icon"
  ).className =
    "w-16 h-16 rounded-full bg-red-50 text-red-600 mx-auto flex items-center justify-center text-2xl font-bold";


  document.getElementById(
    "title"
  ).textContent =
    "Payment Verification Failed";


  document.getElementById(
    "message"
  ).textContent =
    message;

}


verifyPayment();

</script>

</body>

</html>
