 <script>

  // ==========================================
  // LOAD SERVICES FROM OUR BACKEND
  // ==========================================

  let allServices = [];


  async function loadServices() {

    const servicesGrid =
      document.getElementById("servicesGrid");


    servicesGrid.innerHTML = `
      <div class="col-span-full text-center py-12 text-gray-400">
        Loading services...
      </div>
    `;


    try {

      const response = await fetch(
        "https://ogboosting-testing.onrender.com/api/services"
      );


      const data =
        await response.json();


      console.log("Services from Owlet:", data);


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          "Unable to load services."
        );

      }


      allServices =
        data.services || [];


      renderServices(allServices);


    } catch (error) {

      console.error(
        "Services loading error:",
        error
      );


      servicesGrid.innerHTML = `
        <div class="col-span-full text-center py-12">

          <p class="text-red-500 font-bold">
            Unable to load services.
          </p>

          <p class="text-gray-400 text-sm mt-2">
            Please try again later.
          </p>

        </div>
      `;

    }

  }



  // ==========================================
  // RENDER SERVICES
  // ==========================================

  function renderServices(services) {

    const servicesGrid =
      document.getElementById("servicesGrid");


    servicesGrid.innerHTML = "";


    if (!services.length) {

      servicesGrid.innerHTML = `
        <div class="col-span-full text-center py-12 text-gray-400">
          No services available.
        </div>
      `;

      return;

    }


    services.forEach(service => {

      const name =
        service.name || "Service";


      const category =
        (service.category || "Other")
          .toLowerCase();


     const rate =
  Number(service.price || 0);


      const minimum =
        service.min || 0;


      const maximum =
        service.max || 0;


      let platform =
        category;


      // ==========================================
      // PLATFORM
      // ==========================================

      if (category.includes("tiktok")) {

        platform = "tiktok";

      } else if (
        category.includes("instagram")
      ) {

        platform = "instagram";

      } else if (
        category.includes("youtube")
      ) {

        platform = "youtube";

      } else if (
        category.includes("facebook")
      ) {

        platform = "facebook";

      }


      // ==========================================
      // ICON
      // ==========================================

      let icon = "✦";

      let iconClass =
        "bg-gray-100 text-[#0B4F63]";


      if (platform === "tiktok") {

        icon = "TT";

        iconClass =
          "bg-gray-100 text-[#0B4F63]";

      }


      if (platform === "instagram") {

        icon = "IG";

        iconClass =
          "bg-purple-50 text-purple-500";

      }


      if (platform === "youtube") {

        icon = "YT";

        iconClass =
          "bg-red-50 text-red-500";

      }


      if (platform === "facebook") {

        icon = "FB";

        iconClass =
          "bg-blue-50 text-blue-600";

      }


      // ==========================================
      // CREATE CARD
      // ==========================================

      servicesGrid.innerHTML += `

        <div
          class="serviceCard bg-white rounded-2xl border border-gray-100 p-5 sm:p-6 hover:shadow-xl transition"
          data-platform="${platform}"
        >

          <div class="flex items-center justify-between">

            <div
              class="w-12 h-12 rounded-xl ${iconClass} flex items-center justify-center font-extrabold"
            >

              ${icon}

            </div>


            <span
              class="text-[11px] font-bold bg-green-50 text-green-600 px-3 py-1.5 rounded-full"
            >

              Available

            </span>

          </div>


          <h3
            class="mt-5 text-lg sm:text-xl font-bold"
          >

            ${name}

          </h3>


          <p
            class="mt-2 text-gray-500 text-sm leading-6"
          >

            ${service.description ||
              `Order ${name} for your social media account.`}

          </p>


          <div
            class="mt-6 flex items-end justify-between"
          >

            <div>

              <p class="text-xs text-gray-400">

                Starting from

              </p>


              <p
                class="text-lg font-extrabold text-[#0B4F63]"
              >

                ₦${rate.toLocaleString(
                  "en-NG",
                  {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                  }
                )}

              </p>


              <p
                class="text-[10px] text-gray-400 mt-1"
              >

                Min ${Number(minimum).toLocaleString()}
                ·
                Max ${Number(maximum).toLocaleString()}

              </p>

            </div>


            <a
              href="new-order.html?service=${encodeURIComponent(name)}&serviceId=${service.service}"
              class="bg-[#F97316] text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-orange-600 transition"
            >

              Order

            </a>

          </div>

        </div>

      `;

    });


    setupPlatformFilters();

  }



  // ==========================================
  // PLATFORM FILTER
  // ==========================================

  function setupPlatformFilters() {

    const platformButtons =
      document.querySelectorAll(
        ".platformBtn"
      );


    const serviceCards =
      document.querySelectorAll(
        ".serviceCard"
      );


    platformButtons.forEach(button => {

      button.onclick = () => {

        const platform =
          button.dataset.platform;


        // Reset buttons

        platformButtons.forEach(btn => {

          btn.classList.remove(
            "bg-[#0B4F63]",
            "text-white"
          );

          btn.classList.add(
            "bg-white"
          );

        });


        // Active button

        button.classList.remove(
          "bg-white"
        );

        button.classList.add(
          "bg-[#0B4F63]",
          "text-white"
        );


        // Filter

        serviceCards.forEach(card => {

          if (
            platform === "all" ||
            card.dataset.platform === platform
          ) {

            card.classList.remove(
              "hidden"
            );

          } else {

            card.classList.add(
              "hidden"
            );

          }

        });

      };

    });

  }



  // ==========================================
  // START
  // ==========================================

  loadServices();

</script>
