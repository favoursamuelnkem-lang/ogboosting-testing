<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account - OG Boosting</title>

  <link rel="stylesheet" href="./output.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./toast.css">

</head>


<body
  class="min-h-screen bg-[#f6f8fa] text-gray-800 font-[Inter] flex items-center justify-center px-4 py-8"
>


  <!-- MAIN -->

  <main class="w-full max-w-md">


    <!-- LOGO -->

    <div class="text-center mb-8">

      <a
        href="index.html"
        class="inline-flex items-center gap-3"
      >

        <div
          class="w-12 h-12 rounded-2xl bg-[#0B4F63] flex items-center justify-center text-white font-extrabold text-lg shadow-sm"
        >
          OG
        </div>

        <div class="text-left">

          <h1
            class="text-xl font-extrabold text-[#0B4F63]"
          >
            OG Boosting
          </h1>

          <p class="text-[10px] text-gray-400">
            Social Growth
          </p>

        </div>

      </a>

    </div>



    <!-- REGISTER CARD -->

    <section
      class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 sm:p-8"
    >

      <div class="mb-7">

        <p
          class="text-[#F97316] text-xs font-bold uppercase tracking-wider"
        >
          Get started
        </p>

        <h2
          class="mt-2 text-2xl sm:text-3xl font-extrabold text-gray-900"
        >
          Create your account
        </h2>

        <p
          class="mt-2 text-sm text-gray-500"
        >
          Create an account to start using OG Boosting.
        </p>

      </div>



      <!-- REGISTER FORM -->

      <form
        id="registerForm"
        class="space-y-5"
      >


        <!-- FULL NAME -->

        <div>

          <label
            for="fullName"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Full name
          </label>

          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="Enter your full name"
            required
            class="w-full h-13 px-4 rounded-xl border border-gray-200 bg-white outline-none focus:border-[#0B4F63] focus:ring-2 focus:ring-[#0B4F63]/10 transition"
          >

        </div>



        <!-- EMAIL -->

        <div>

          <label
            for="email"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
            class="w-full h-13 px-4 rounded-xl border border-gray-200 bg-white outline-none focus:border-[#0B4F63] focus:ring-2 focus:ring-[#0B4F63]/10 transition"
          >

        </div>



        <!-- PASSWORD -->

        <div>

          <label
            for="password"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Password
          </label>

          <div class="relative">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Create a password"
              minlength="8"
              required
              class="w-full h-13 px-4 pr-12 rounded-xl border border-gray-200 bg-white outline-none focus:border-[#0B4F63] focus:ring-2 focus:ring-[#0B4F63]/10 transition"
            >

            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg text-gray-400 hover:bg-gray-50"
              aria-label="Show password"
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.7"
                stroke="currentColor"
                class="w-5 h-5 mx-auto"
              >

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 12s3.75-6 9.75-6 9.75 6 9.75 6-3.75 6-9.75 6-9.75-6-9.75-6Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />

              </svg>

            </button>

          </div>

          <p class="text-xs text-gray-400 mt-2">
            Use at least 8 characters.
          </p>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div>

          <label
            for="confirmPassword"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Confirm password
          </label>

          <div class="relative">

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm your password"
              minlength="8"
              required
              class="w-full h-13 px-4 pr-12 rounded-xl border border-gray-200 bg-white outline-none focus:border-[#0B4F63] focus:ring-2 focus:ring-[#0B4F63]/10 transition"
            >

            <button
              type="button"
              id="toggleConfirmPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg text-gray-400 hover:bg-gray-50"
              aria-label="Show password"
            >

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.7"
                stroke="currentColor"
                class="w-5 h-5 mx-auto"
              >

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 12s3.75-6 9.75-6 9.75 6 9.75 6-3.75 6-9.75 6-9.75-6-9.75-6Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />

              </svg>

            </button>

          </div>

        </div>



        <!-- TERMS -->

        <div class="flex items-start gap-3">

          <input
            id="terms"
            type="checkbox"
            required
            class="w-4 h-4 mt-1 accent-[#0B4F63]"
          >

          <label
            for="terms"
            class="text-sm text-gray-500 leading-5"
          >
            I agree to the
            <a
              href="#"
              class="text-[#0B4F63] font-semibold"
            >
              Terms of Service
            </a>
            and
            <a
              href="#"
              class="text-[#0B4F63] font-semibold"
            >
              Privacy Policy
            </a>.
          </label>

        </div>



        <!-- REGISTER BUTTON -->

        <button
          type="submit"
          id="registerBtn"
          class="w-full h-13 rounded-xl bg-[#F97316] text-white font-bold hover:bg-orange-600 active:scale-[0.99] transition"
        >
          Create Account
        </button>


      </form>



      <!-- LOGIN -->

      <div class="relative my-7">

        <div class="absolute inset-0 flex items-center">

          <div class="w-full border-t border-gray-100"></div>

        </div>

        <div class="relative flex justify-center">

          <span
            class="bg-white px-4 text-xs text-gray-400"
          >
            Already have an account?
          </span>

        </div>

      </div>


      <a
        href="login.html"
        class="w-full h-12 rounded-xl border border-gray-200 flex items-center justify-center font-bold text-[#0B4F63] hover:bg-gray-50 transition"
      >
        Sign In
      </a>

    </section>



    <!-- FOOTER -->

    <p class="text-center text-xs text-gray-400 mt-6">

      © 2026 OG Boosting. All rights reserved.

    </p>


  </main>



  <!-- JAVASCRIPT -->

 <script src="./toast.js"></script>

<script>

  const password =
    document.getElementById("password");

  const confirmPassword =
    document.getElementById("confirmPassword");

  const togglePassword =
    document.getElementById("togglePassword");

  const toggleConfirmPassword =
    document.getElementById("toggleConfirmPassword");

  const registerForm =
    document.getElementById("registerForm");

  const registerBtn =
    document.getElementById("registerBtn");


  // ===============================
  // SHOW / HIDE PASSWORD
  // ===============================

  togglePassword.addEventListener("click", () => {

    password.type =
      password.type === "password"
        ? "text"
        : "password";

  });


  // ===============================
  // SHOW / HIDE CONFIRM PASSWORD
  // ===============================

  toggleConfirmPassword.addEventListener("click", () => {

    confirmPassword.type =
      confirmPassword.type === "password"
        ? "text"
        : "password";

  });


  // ===============================
  // REGISTER
  // ===============================

  registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    const fullName =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const passwordValue =
      password.value;

    const confirmPasswordValue =
      confirmPassword.value;


    // CHECK PASSWORD MATCH

    if (passwordValue !== confirmPasswordValue) {

      showToast("Passwords do not match.", "warning", { title: "Check your password" });

      return;

    }


    // CHECK PASSWORD LENGTH

    if (passwordValue.length < 8) {

      showToast("Password must be at least 8 characters.", "warning", { title: "Password too short" });

      return;

    }


    // DISABLE BUTTON

    registerBtn.disabled = true;

    registerBtn.innerText = "Creating Account...";


    try {

      const response = await fetch(
        "https://ogboosting-testing.onrender.com/api/auth/register",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            fullName: fullName,

            email: email,

            password: passwordValue

          })

        }
      );


      const data = await response.json();


      // BACKEND ERROR

      if (!response.ok) {

        showToast(data.message || "Registration failed.", "error", { title: "Registration failed" });

        registerBtn.disabled = false;

        registerBtn.innerText = "Create Account";

        return;

      }


      // SUCCESS

      showToast("Your account has been created. You can sign in now.", "success", { title: "Account created" });


      // SEND USER TO LOGIN

      window.location.href = "login.html";


    } catch (error) {

      console.error("Registration error:", error);

      showToast("Unable to connect to the server. Make sure your backend is running.", "error", { title: "Connection error", duration: 6000 });


      registerBtn.disabled = false;

      registerBtn.innerText = "Create Account";

    }

  });

</script>

</body>

</html>
