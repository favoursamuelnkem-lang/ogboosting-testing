<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - OG Boosting</title>
  <link rel="stylesheet" href="./output.css">
</head>
<body class="min-h-screen bg-[#f6f8fa] flex items-center justify-center px-5">
  <main class="w-full max-w-md">
    <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 p-7 sm:p-9">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-12 h-12 rounded-2xl bg-[#0B4F63] flex items-center justify-center">
          <span class="text-white font-black">OG</span>
        </div>
        <div>
          <h1 class="font-black text-xl text-[#0B4F63]">OG<span class="text-orange-500">Boost</span></h1>
          <p class="text-xs text-gray-400 uppercase tracking-widest">Admin Panel</p>
        </div>
      </div>

      <h2 class="text-2xl font-black text-gray-900">Admin sign in</h2>
      <p class="text-sm text-gray-400 mt-2 mb-7">Sign in to manage users, orders, wallets and provider activity.</p>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Admin email</label>
          <input id="email" type="email" required autocomplete="username"
            class="w-full px-4 py-3.5 rounded-xl border border-gray-200 outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input id="password" type="password" required autocomplete="current-password"
            class="w-full px-4 py-3.5 rounded-xl border border-gray-200 outline-none focus:border-orange-500">
        </div>

        <p id="loginMessage" class="hidden text-sm rounded-xl px-4 py-3"></p>

        <button id="loginButton" type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3.5 rounded-xl font-bold transition">
          Sign in
        </button>
      </form>
    </div>
  </main>

  <script src="./admin-login.js"></script>
</body>
</html>
