<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - OG Boosting</title>

  <link rel="stylesheet" href="./output.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./toast.css">

</head>


<body
  class="min-h-screen bg-[#f6f8fa] text-gray-800 font-[Inter] flex items-center justify-center px-4 py-8"
>


  <!-- MAIN -->

  <main class="w-full max-w-md">


    <!-- LOGO -->

    <div class="text-center mb-8">

      <a
        href="index.html"
        class="inline-flex items-center gap-3"
      >

        <div
          class="w-12 h-12 rounded-2xl bg-[#0B4F63] flex items-center justify-center text-white font-extrabold text-lg shadow-sm"
        >
          OG
        </div>

        <div class="text-left">

          <h1
            class="text-xl font-extrabold text-[#0B4F63]"
          >
            OG Boosting
          </h1>

          <p class="text-[10px] text-gray-400">
            Social Growth
          </p>

        </div>

      </a>

    </div>



    <!-- LOGIN CARD -->

    <section
      class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 sm:p-8"
    >

      <div class="mb-7">

        <p
          class="text-[#F97316] text-xs font-bold uppercase tracking-wider"
        >
          Welcome back
        </p>

        <h2
          class="mt-2 text-2xl sm:text-3xl font-extrabold text-gray-900"
        >
          Sign in to your account
        </h2>

        <p
          class="mt-2 text-sm text-gray-500"
        >
          Access your wallet, orders and boosting services.
        </p>

      </div>



      <!-- LOGIN FORM -->

      <form id="loginForm" class="space-y-5">


        <!-- EMAIL -->

        <div>

          <label
            for="email"
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
            class="w-full h-13 px-4 rounded-xl border border-gray-200 bg-white outline-none focus:border-[#0B4F63] focus:ring-2 focus:ring-[#0B4F63]/10 transition"
          >

        </div>



        <!-- PASSWORD -->

        <div>

          <div class="flex items-center justify-between mb-2">

            <label
              for="password"
              class="block text-sm font-semibold text-gray-700"
            >
              Password
            </label>

            <a
              href="forgot-password.html"
              class="text-xs sm:text-sm font-semibold text-[#F97316] hover:text-orange-600"
            >
              Forgot password?
            </a>

          </div>


          <div class="relative">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
              class="w-full h-13 px-4 pr-12 rounded-xl border border-gray-200 bg-white outline-none focus:border-[#0B4F63] focus:ring-2 focus:ring-[#0B4F63]/10 transition"
            >

            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg text-gray-400 hover:bg-gray-50"
              aria-label="Show password"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.7"
                stroke="currentColor"
                class="w-5 h-5 mx-auto"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 12s3.75-6 9.75-6 9.75 6 9.75 6-3.75 6-9.75 6-9.75-6-9.75-6Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            </button>

          </div>

        </div>



        <!-- REMEMBER -->

        <div class="flex items-center gap-2">

          <input
            id="remember"
            type="checkbox"
            class="w-4 h-4 accent-[#0B4F63]"
          >

          <label
            for="remember"
            class="text-sm text-gray-500"
          >
            Remember me
          </label>

        </div>



        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          id="loginBtn"
          class="w-full h-13 rounded-xl bg-[#F97316] text-white font-bold hover:bg-orange-600 active:scale-[0.99] transition"
        >
          Sign In
        </button>


      </form>



      <!-- REGISTER -->

      <div class="relative my-7">

        <div class="absolute inset-0 flex items-center">

          <div class="w-full border-t border-gray-100"></div>

        </div>

        <div class="relative flex justify-center">

          <span
            class="bg-white px-4 text-xs text-gray-400"
          >
            New to OG Boosting?
          </span>

        </div>

      </div>


      <a
        href="register.html"
        class="w-full h-12 rounded-xl border border-gray-200 flex items-center justify-center font-bold text-[#0B4F63] hover:bg-gray-50 transition"
      >
        Create an account
      </a>

    </section>



    <!-- FOOTER -->

    <p class="text-center text-xs text-gray-400 mt-6">

      By continuing, you agree to our

      <a
        href="#"
        class="text-[#0B4F63] font-semibold"
      >
        Terms
      </a>

      and

      <a
        href="#"
        class="text-[#0B4F63] font-semibold"
      >
        Privacy Policy
      </a>

    </p>


  </main>



  <!-- JAVASCRIPT -->
<script src="./toast.js"></script>

<script>

  const password =
    document.getElementById("password");

  const togglePassword =
    document.getElementById("togglePassword");

  const loginForm =
    document.getElementById("loginForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const remember =
    document.getElementById("remember");


  // ===============================
  // SHOW / HIDE PASSWORD
  // ===============================

  togglePassword.addEventListener("click", () => {

    if (password.type === "password") {

      password.type = "text";

    } else {

      password.type = "password";

    }

  });


  // ===============================
  // LOGIN
  // ===============================

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    const email =
      document.getElementById("email").value.trim();

    const passwordValue =
      password.value;


    if (!email || !passwordValue) {

      showToast("Please enter your email and password.", "warning", { title: "Missing information" });

      return;

    }


    // DISABLE BUTTON

    loginBtn.disabled = true;

    loginBtn.innerText = "Signing In...";


    try {

      const response = await fetch(
        "https://ogboosting-testing.onrender.com/api/auth/login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            email: email,

            password: passwordValue

          })
        }
      );


      const data = await response.json();


      // LOGIN FAILED

      if (!response.ok) {

        showToast(data.message || "Login failed.", "error", { title: "Login failed" });

        loginBtn.disabled = false;

        loginBtn.innerText = "Sign In";

        return;

      }


      // ===============================
      // SAVE LOGIN INFORMATION
      // ===============================

      if (remember.checked) {

        localStorage.setItem(
          "ogBoostingToken",
          data.token
        );

        localStorage.setItem(
          "ogBoostingUser",
          JSON.stringify(data.user)
        );

      } else {

        sessionStorage.setItem(
          "ogBoostingToken",
          data.token
        );

        sessionStorage.setItem(
          "ogBoostingUser",
          JSON.stringify(data.user)
        );

      }


      // SUCCESS

      showToast("Welcome back! Signing you in now.", "success", { title: "Welcome back" });


      // GO TO DASHBOARD

      window.location.href = "dashboard.html";


    } catch (error) {

      console.error("Login error:", error);

      showToast("Unable to connect to the server. Make sure your backend is running.", "error", { title: "Connection error", duration: 6000 });


      loginBtn.disabled = false;

      loginBtn.innerText = "Sign In";

    }

  });

</script>

</body>

</html>
